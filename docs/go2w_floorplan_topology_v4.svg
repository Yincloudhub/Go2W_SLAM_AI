<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="768" viewBox="0 0 2730 1536">
  <defs>
    <style>
      .node { stroke: #0f172a; stroke-width: 5; }
      .route { stroke: #2563eb; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }
      .risk { stroke: #dc2626; stroke-width: 6; fill: none; stroke-dasharray: 18 14; stroke-linecap: round; opacity: 0.78; }
      .label-bg { fill: white; opacity: 0.88; stroke: #cbd5e1; stroke-width: 2; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #0f172a; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 24px; fill: #334155; }
      .note { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 24px; fill: #991b1b; }
    </style>
  </defs>

  <image href="assets/go2w_floorplan_v4.png" x="0" y="0" width="2730" height="1536"/>

  <!-- Semantic topology routes. Dashed red means every corridor route has possible human traffic. -->
  <path class="risk" d="M1308 918 L1308 376 L1644 376"/>
  <path class="risk" d="M1308 376 L1922 184"/>
  <path class="risk" d="M1308 918 L1308 1298"/>
  <path class="risk" d="M1308 918 L1212 1170"/>
  <path class="risk" d="M1308 918 L1108 486"/>
  <path class="risk" d="M1308 918 L1682 686"/>
  <path class="risk" d="M1308 918 L2162 1296"/>
  <path class="risk" d="M2162 1296 L2534 512"/>
  <path class="risk" d="M1308 918 L184 676"/>
  <path class="route" d="M1308 918 L1308 376"/>

