# Orin NX mainline runtime config

acquisition.num_adc_bits = 16
acquisition.num_lanes = 4
acquisition.is_real = false

fft.nr = 1024
fft.frag = 2000
fft.step = 200
fft.zero_range_bins = 100
fft.circshift_range_bins = 512
fft.zero_head_after_shift = 20
fft.zero_tail_after_shift = 20

imaging.channel_mode = single
imaging.channel_index = 0
imaging.interpolation_mode = spline
imaging.backend = cpu_serial
imaging.scene.rmax_m = 40
imaging.scene.prf_hz = 9660
imaging.scene.c_mps = 3e8
imaging.scene.fc_hz = 7.6e10
imaging.scene.fs_hz = 2.25e7
imaging.scene.beam_width_deg = 120
imaging.scene.squint_angle_deg = 0
imaging.scene.grid_spacing_m = 0.03

runtime.mode = offline
runtime.max_frames = 1
runtime.realtime_poll_interval_ms = 0
runtime.continue_on_frame_error = true
runtime.max_consecutive_frame_errors = 2

stream.source = bin_replay
stream.replay_rate_hz = 9660
stream.ring_columns = 4096

display.enabled = true
display.save_every_n = 0

render.jet_levels = 15000
render.apply_myorder = true
render.output_gamma = 1
