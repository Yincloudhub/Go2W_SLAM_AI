# Smoke SFT config — CPU fp32, Qwen3-0.6B, max_steps=20
stage: sft
do_train: true
model_name_or_path: Qwen/Qwen3-0.6B
dataset: go2w_mission_agent_train
eval_dataset: go2w_mission_agent_val
template: qwen
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,v_proj
output_dir: saves/qwen3-0.6b/lora/go2w-mission-agent-smoke
overwrite_output_dir: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
num_train_epochs: 1
max_steps: 10
lr_scheduler_type: cosine
warmup_ratio: 0.03
cutoff_len: 2048
bf16: false
logging_steps: 5
save_steps: 100
eval_steps: 20
per_device_eval_batch_size: 1
val_size: 0.0
plot_loss: false
